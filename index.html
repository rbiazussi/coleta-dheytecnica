<style>
/* Layout idea: one narrow column wizard; navy brand bar on top, a step rail, one question group per screen, sticky back/next bar. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#001244; --muted:#5A6478; --line:#D3DAE7; --field:#F7F9FC;
  --brand:#001244; --accent:#0074FF; --ok:#00BF16; --okink:#04310A; --warn:#B25B00;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070C1D; --surface:#0F1731; --ink:#E7ECF7; --muted:#9BA7BF; --line:#27335A; --field:#0A1126; --accent:#58A3FF; --ok:#27D43C; --okink:#03240A; --warn:#F0A04B; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#070C1D; --surface:#0F1731; --ink:#E7ECF7; --muted:#9BA7BF; --line:#27335A; --field:#0A1126; --accent:#58A3FF; --ok:#27D43C; --okink:#03240A; --warn:#F0A04B; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.4}
header.bar{background:var(--brand);color:#fff;border-bottom:4px solid var(--ok)}
.bar .in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wm{font-weight:700;font-size:20px;letter-spacing:.02em}
.tag{font-family:var(--mono);font-size:11px;opacity:.8;flex:1;min-width:150px}
.langs{display:flex;gap:4px}
.langs button{font-family:var(--mono);font-size:12px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:6px 9px;cursor:pointer}
.langs button[aria-pressed="true"]{background:#fff;color:var(--brand);border-color:#fff}
.rail{max-width:760px;margin:0 auto;padding:10px 16px 0;display:flex;gap:6px;overflow-x:auto}
.rail button{flex:none;font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.rail button.cur{background:var(--accent);border-color:var(--accent);color:#fff}
.rail button.done{color:var(--ink);border-color:var(--ok)}
main{max-width:760px;margin:0 auto;padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:6px 0 0;text-wrap:balance}
h2{font-size:17px;margin:10px 0 0;color:var(--accent);text-wrap:balance}
p{margin:0;max-width:65ch}
.lead{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.band{display:flex;align-items:stretch;border-radius:8px;overflow:hidden}
.band b{background:var(--ok);color:var(--okink);font-family:var(--mono);font-size:13px;padding:9px 10px;display:flex;align-items:center}
.band span{background:var(--brand);color:#fff;font-weight:700;padding:9px 12px;flex:1}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-weight:600;font-size:15px}
.f .ask{font-style:italic;font-size:14px}
.f .hint{color:var(--muted);font-size:12.5px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:44px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .box{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;margin-top:2px}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.opt small{display:block;color:var(--muted);font-size:12.5px}
.opt .code{font-family:var(--mono);font-size:11px;color:var(--accent)}
.badge{font-family:var(--mono);font-size:10.5px;border-radius:3px;padding:2px 6px;color:#fff;align-self:flex-start}
.badge.Rep{background:var(--ok);color:var(--okink)} .badge.Cli{background:var(--accent)} .badge.Dht{background:#3A4770}
.row2{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details>summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary .code{font-family:var(--mono);font-size:12px;background:var(--ok);color:var(--okink);border-radius:4px;padding:3px 7px}
details>summary .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
details>.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.ctx{background:var(--field);border-left:3px solid var(--accent);padding:8px 10px;font-size:14px;border-radius:0 6px 6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--brand);color:#fff;text-align:left;padding:6px 8px;font-weight:600;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
table.grid td{padding:3px}
table.grid td.fx{padding:6px 8px;background:var(--field);min-width:150px}
table.grid input{min-width:92px;padding:6px 7px;font-size:14px}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:7px 11px;font-size:13.5px;font-weight:500}
.btn.danger{color:var(--warn)}
nav.foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
nav.foot .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
nav.foot .sp{flex:1;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
pre.sum{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;max-height:60vh;overflow:auto}
.note{font-size:13px;color:var(--muted)}
.msg{font-family:var(--mono);font-size:12px;color:var(--accent);min-height:16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
body.treino header.bar{border-bottom-color:var(--warn)}
body.treino .tag{color:#FFD9A8;opacity:1}
@media print{nav.foot,.rail,.langs,.acts,.msg,.lead{display:none!important}body{background:#fff;color:#000}main{padding:0;max-width:none}pre.sum{max-height:none;overflow:visible;border:0;font-size:10.5px}}
@media (prefers-reduced-motion:no-preference){ .opt,.btn{transition:border-color .12s, background-color .12s} }
</style>
</head>

<main id="main"></main>

<script>
const D={"fichas":[{"code":"R1","title":["Rendering novo completo","Rendering nuevo completo","Complete new rendering plant"],"intro":["Para frigorífico novo ou planta que hoje vende ou descarta o subproduto cru.","Para un frigorífico nuevo o una planta que hoy vende o descarta el subproducto crudo.","For a new slaughterhouse or a plant that today sells or discards raw by-products."],"rows":[[["Abate na partida e na capacidade plena","“Quantos animais por dia no primeiro ano e quando a planta estiver cheia?”","Plano de negócios"],["Faena en el arranque y a plena capacidad","“¿Cuántos animales por día en el primer año y cuando la planta esté llena?”","Plan de negocios"],["Slaughter at start-up and at full capacity","“How many animals per day in the first year and when the plant is full?”","Business plan"]],[["Peso médio vivo","“Com que peso o animal chega?”","Controle de abate"],["Peso vivo promedio","“¿Con qué peso llega el animal?”","Control de faena"],["Average live weight","“At what weight do the animals arrive?”","Slaughter records"]],[["Correntes de matéria-prima","“O que sobra do abate: vísceras, penas, sangue, ossos, gordura, condenados?”","Balança ou estimativa por cabeça"],["Corrientes de materia prima","“¿Qué sobra de la faena: vísceras, plumas, sangre, huesos, grasa, decomisos?”","Báscula o estimación por cabeza"],["Raw material streams","“What is left over from slaughter: viscera, feathers, blood, bones, fat, condemned material?”","Scale or estimate per head"]],[["Destino e valor atual de cada corrente","“Quanto recebe ou quanto paga por tonelada hoje?”","Notas fiscais, contrato com coletor"],["Destino y valor actual de cada corriente","“¿Cuánto recibe o cuánto paga por tonelada hoy?”","Facturas, contrato con el recolector"],["Current destination and value of each stream","“How much do you receive or pay per tonne today?”","Invoices, contract with the collector"]],[["Matéria-prima de terceiros","“Pretende receber material de outras plantas?”","Cliente"],["Materia prima de terceros","“¿Piensa recibir material de otras plantas?”","Cliente"],["Third-party raw material","“Do you intend to receive material from other plants?”","Client"]],[["Produtos de interesse","“Quer vender farinha e óleo comuns ou produto de maior valor, como pet food?”","Cliente, compradores da região"],["Productos de interés","“¿Quiere vender harina y aceite comunes o un producto de mayor valor, como pet food?”","Cliente, compradores de la región"],["Products of interest","“Do you want to sell standard meal and fat, or a higher-value product such as pet food grade?”","Client, buyers in the region"]],[["Vapor disponível","“A caldeira do frigorífico tem folga ou precisa de uma nova?”","Placa da caldeira"],["Vapor disponible","“¿La caldera del frigorífico tiene holgura o necesita una nueva?”","Placa de la caldera"],["Steam available","“Does the slaughterhouse boiler have spare capacity, or is a new one needed?”","Boiler nameplate"]],[["Área disponível e distância de vizinhos","“Onde ficaria a graxaria? Há casas perto?”","Layout, visita"],["Área disponible y distancia a vecinos","“¿Dónde quedaría la planta de rendering? ¿Hay casas cerca?”","Layout, visita"],["Available area and distance to neighbours","“Where would the rendering plant go? Are there houses nearby?”","Layout, site visit"]],[["Escopo esperado","“Quer só equipamentos, montagem ou a planta pronta?”","Cliente"],["Alcance esperado","“¿Quiere solo equipos, montaje o la planta llave en mano?”","Cliente"],["Expected scope","“Do you want equipment only, installation, or a turnkey plant?”","Client"]]],"extras":[[["b","<b>Desejável:<\/b> curva de crescimento do abate ano a ano, preço regional de farinha e gordura, custo do combustível, tensão e frequência elétrica, situação da licença ambiental."],["b","<b>Pedir:<\/b> layout de implantação, fluxograma do abate, plano de negócios."],["b","<b>Atenção:<\/b> a viabilidade vem da margem sobre o que a matéria-prima já vale hoje, não da receita bruta. Por isso o destino atual de cada corrente é obrigatório."]],[["b","<b>Deseable:<\/b> curva de crecimiento de la faena año por año, precio regional de harina y grasa, costo del combustible, tensión y frecuencia eléctrica, situación de la licencia ambiental."],["b","<b>Pedir:<\/b> layout de implantación, diagrama de flujo de la faena, plan de negocios."],["b","<b>Atención:<\/b> la viabilidad viene del margen sobre lo que la materia prima ya vale hoy, no del ingreso bruto. Por eso el destino actual de cada corriente es obligatorio."]],[["b","<b>Nice to have:<\/b> year-by-year slaughter growth curve, regional price of meal and fat, fuel cost, electrical voltage and frequency, status of the environmental licence."],["b","<b>Ask for:<\/b> site layout, slaughter flow diagram, business plan."],["b","<b>Note:<\/b> feasibility comes from the margin over what the raw material is already worth today, not from gross revenue. That is why the current destination of each stream is mandatory."]]]},{"code":"R2","title":["Ampliação","Ampliación","Expansion"],"intro":["Para planta em operação que vai receber mais matéria-prima.","Para una planta en operación que va a recibir más materia prima.","For an operating plant that will receive more raw material."],"rows":[[["Matéria-prima hoje e depois da ampliação, por linha","“Quantas toneladas por dia entram hoje e quantas vão entrar?”","Balança, controle de produção"],["Materia prima hoy y después de la ampliación, por línea","“¿Cuántas toneladas por día entran hoy y cuántas van a entrar?”","Báscula, control de producción"],["Raw material today and after expansion, per line","“How many tonnes per day come in today and how many will come in?”","Scale, production records"]],[["Horas de operação do rendering","“A graxaria roda quantas horas? Pode rodar mais?”","Supervisor"],["Horas de operación del rendering","“¿Cuántas horas trabaja la planta de rendering? ¿Puede trabajar más?”","Supervisor"],["Rendering operating hours","“How many hours does the rendering plant run? Can it run longer?”","Supervisor"]],[["Equipamentos principais","“Quantos digestores, de que tamanho, de que marca e ano?”","Placas dos equipamentos"],["Equipos principales","“¿Cuántos digestores, de qué tamaño, de qué marca y año?”","Placas de los equipos"],["Main equipment","“How many cookers, what size, what make and year?”","Equipment nameplates"]],[["Processo","“É por batelada ou contínuo?”","Visita"],["Proceso","“¿Es por lotes (batch) o continuo?”","Visita"],["Process","“Is it batch or continuous?”","Site visit"]],[["Gargalo percebido","“Onde a linha trava primeiro?”","Operador"],["Cuello de botella percibido","“¿Dónde se traba primero la línea?”","Operador"],["Perceived bottleneck","“Where does the line choke first?”","Operator"]],[["Folga de vapor e de energia elétrica","“A caldeira aguenta mais consumo?”","Placa da caldeira, conta de energia"],["Holgura de vapor y de energía eléctrica","“¿La caldera aguanta más consumo?”","Placa de la caldera, factura de energía"],["Spare steam and electrical capacity","“Can the boiler take more load?”","Boiler nameplate, energy bill"]],[["Espaço físico","“Há área ao lado da linha atual?”","Layout, fotos"],["Espacio físico","“¿Hay área al lado de la línea actual?”","Layout, fotos"],["Physical space","“Is there room next to the current line?”","Layout, photos"]]],"extras":[[["b","<b>Desejável:<\/b> tempos de ciclo dos digestores (carga, cocção, descarga), produção diária de farinha e óleo, capacidade do tratamento de gases e da ETE."],["b","<b>Pedir:<\/b> fotos das placas, layout da área, fluxograma."],["b","<b>Observar na visita:<\/b> matéria-prima acumulada no pátio, equipamentos parados, improvisos na linha."]],[["b","<b>Deseable:<\/b> tiempos de ciclo de los digestores (carga, cocción, descarga), producción diaria de harina y aceite, capacidad del tratamiento de gases y de la PTAR."],["b","<b>Pedir:<\/b> fotos de las placas, layout del área, diagrama de flujo."],["b","<b>Observar en la visita:<\/b> materia prima acumulada en el patio, equipos parados, improvisaciones en la línea."]],[["b","<b>Nice to have:<\/b> cooker cycle times (loading, cooking, discharge), daily production of meal and fat, capacity of the gas treatment and of the WWTP."],["b","<b>Ask for:<\/b> nameplate photos, area layout, flow diagram."],["b","<b>Look for on site:<\/b> raw material piled up in the yard, idle equipment, makeshift fixes on the line."]]]},{"code":"R3","title":["Modernização ou upgrade","Modernización o upgrade","Modernisation or upgrade"],"intro":["Para planta que não muda de volume, mas quer operar melhor.","Para una planta que no cambia de volumen, pero quiere operar mejor.","For a plant that is not changing volume but wants to run better."],"rows":[[["Idade e estado dos equipamentos principais","“Quais equipamentos dão mais problema?”","Manutenção"],["Edad y estado de los equipos principales","“¿Qué equipos dan más problemas?”","Mantenimiento"],["Age and condition of the main equipment","“Which equipment gives the most trouble?”","Maintenance"]],[["Paradas não programadas","“Quantas horas por mês a linha fica parada, e por quê?”","Registro de manutenção"],["Paradas no programadas","“¿Cuántas horas por mes queda parada la línea, y por qué?”","Registro de mantenimiento"],["Unplanned stoppages","“How many hours per month is the line down, and why?”","Maintenance records"]],[["Pessoas por turno","“Quantos operadores a graxaria ocupa?”","Supervisor"],["Personas por turno","“¿Cuántos operadores ocupa la planta de rendering?”","Supervisor"],["People per shift","“How many operators does the rendering plant need?”","Supervisor"]],[["Nível de automação","“A linha tem painel com supervisório ou é tudo manual?”","Visita"],["Nivel de automatización","“¿La línea tiene tablero con sistema de supervisión o todo es manual?”","Visita"],["Automation level","“Does the line have a control panel with SCADA, or is it all manual?”","Site visit"]],[["Problemas de odor","“Há reclamação ou exigência do órgão ambiental?”","Cliente, licença"],["Problemas de olor","“¿Hay quejas o exigencia de la autoridad ambiental?”","Cliente, licencia"],["Odour problems","“Are there complaints or requirements from the environmental authority?”","Client, licence"]],[["Objetivo principal","“Se resolvesse uma coisa só, qual seria?”","Decisor"],["Objetivo principal","“Si resolviera una sola cosa, ¿cuál sería?”","Decisor"],["Main objective","“If you could fix just one thing, what would it be?”","Decision maker"]]],"extras":[[["b","<b>Desejável:<\/b> custo anual de manutenção, histórico de acidentes ou vazamentos, janela de parada disponível para a obra."],["b","<b>Pedir:<\/b> fotos de cada equipamento e de sua placa, fluxograma atual."],["b","<b>Observar na visita:<\/b> vazamentos de vapor, isolamento térmico danificado, corrosão, matéria-prima manuseada à mão."]],[["b","<b>Deseable:<\/b> costo anual de mantenimiento, historial de accidentes o fugas, ventana de parada disponible para la obra."],["b","<b>Pedir:<\/b> fotos de cada equipo y de su placa, diagrama de flujo actual."],["b","<b>Observar en la visita:<\/b> fugas de vapor, aislamiento térmico dañado, corrosión, materia prima manipulada a mano."]],[["b","<b>Nice to have:<\/b> annual maintenance cost, history of accidents or leaks, shutdown window available for the works."],["b","<b>Ask for:<\/b> photos of each piece of equipment and its nameplate, current flow diagram."],["b","<b>Look for on site:<\/b> steam leaks, damaged thermal insulation, corrosion, raw material handled by hand."]]]},{"code":"R4","title":["Recuperação de energia e eficiência térmica","Recuperación de energía y eficiencia térmica","Energy recovery and thermal efficiency"],"intro":["Para cliente que reclama do custo de combustível ou de falta de vapor. O representante não estima consumo nem compara com indicadores; ele segue a sequência de perguntas abaixo, nesta ordem.","Para un cliente que se queja del costo del combustible o de falta de vapor. El representante no estima consumo ni compara con indicadores; sigue la secuencia de preguntas siguiente, en este orden.","For a client complaining about fuel cost or lack of steam. The representative does not estimate consumption or compare against benchmarks; they follow the sequence of questions below, in this order."],"rows":[[["1. Tecnologia usada","“A linha é via seca ou via úmida? Por batelada ou contínua? Tem digestor contínuo, secador Rotatubos ou secador de discos?”"],["1. Tecnología usada","“¿La línea es por vía seca o por vía húmeda? ¿Por lotes o continua? ¿Tiene digestor continuo, secador Rotatubos o secador de discos?”"],["1. Technology in use","“Is the line dry or wet rendering? Batch or continuous? Does it have a continuous cooker, a Rotatubos dryer or a disc dryer?”"]],[["2. Medição de vapor","“Existe alguma medição do consumo de vapor? Da planta toda ou por linha?”"],["2. Medición de vapor","“¿Existe alguna medición del consumo de vapor? ¿De toda la planta o por línea?”"],["2. Steam metering","“Is steam consumption measured at all? For the whole plant or per line?”"]],[["3. Recuperação já existente","“Hoje há alguma tecnologia de recuperação de energia térmica instalada? Qual?”"],["3. Recuperación ya existente","“¿Hoy hay alguna tecnología de recuperación de energía térmica instalada? ¿Cuál?”"],["3. Existing recovery","“Is any thermal energy recovery technology installed today? Which one?”"]],[["4. Consumo de água quente","“A planta consome água quente? Quanto, em que faixa de temperatura, qual o consumo médio e o de pico?”"],["4. Consumo de agua caliente","“¿La planta consume agua caliente? ¿Cuánta, en qué rango de temperatura, cuál es el consumo promedio y el pico?”"],["4. Hot water consumption","“Does the plant use hot water? How much, in what temperature range, what are the average and peak consumption?”"]],[["5. Custo do vapor","“Quanto custa o vapor, ou quanto gasta por mês com combustível?”"],["5. Costo del vapor","“¿Cuánto cuesta el vapor, o cuánto gasta por mes en combustible?”"],["5. Steam cost","“How much does steam cost, or how much do you spend per month on fuel?”"]],[["6. Uso de vapor de baixa pressão","“Há algum ponto da fábrica que use ou possa usar vapor de baixa pressão, até 1,5 bar?”"],["6. Uso de vapor de baja presión","“¿Hay algún punto de la planta que use o pueda usar vapor de baja presión, hasta 1,5 bar?”"],["6. Use for low-pressure steam","“Is there any point in the plant that uses or could use low-pressure steam, up to 1.5 bar?”"]],[["7. Condensado","“O condensado dos equipamentos volta para a caldeira?”"],["7. Condensado","“¿El condensado de los equipos vuelve a la caldera?”"],["7. Condensate","“Does the condensate from the equipment return to the boiler?”"]]],"extras":[[["p","Se a planta ainda não recupera energia, há três caminhos simples. As respostas acima dizem qual se aplica."],["t",["Caminho","O que faz","Depende de"],[["Aquecimento de água com os vapores de cocção","Usa o calor dos vapores de cocção para produzir água quente","O cliente consumir água quente: quantidade, faixa de temperatura, consumo médio e de pico, custo do vapor"],["SRF, recuperação de vapor flash","Gera vapor de baixa pressão, até 1,5 bar","O cliente ter uso para vapor de baixa pressão"],["SRC, retorno direto de condensado","Devolve o condensado direto à caldeira e evita a geração de vapor flash","A linha ter digestores contínuos, secadores Rotatubos ou secadores de discos"]]],["p","Quando o processo atual é via seca e o cliente busca eficiência energética, há um quarto caminho, com duas opções: fazer o upgrade da linha existente para uma linha mista, ou mudar totalmente a tecnologia, trocando a linha toda por uma linha úmida. Nesse caso, aplique também a ficha R3."],["b","<b>Pedir:<\/b> fotos da caldeira, dos digestores ou secadores, do condensador e do tanque de condensado; três últimas notas de combustível."],["b","<b>Observar na visita:<\/b> vapor saindo para a atmosfera, purgadores vazando, água quente sendo aquecida com vapor direto."]],[["p","Si la planta aún no recupera energía, hay tres caminos simples. Las respuestas anteriores dicen cuál aplica."],["t",["Camino","Qué hace","Depende de"],[["Calentamiento de agua con los vahos de cocción","Usa el calor de los vahos de cocción para producir agua caliente","Que el cliente consuma agua caliente: cantidad, rango de temperatura, consumo promedio y pico, costo del vapor"],["SRF, recuperación de vapor flash","Genera vapor de baja presión, hasta 1,5 bar","Que el cliente tenga uso para vapor de baja presión"],["SRC, retorno directo de condensado","Devuelve el condensado directo a la caldera y evita la generación de vapor flash","Que la línea tenga digestores continuos, secadores Rotatubos o secadores de discos"]]],["p","Cuando el proceso actual es por vía seca y el cliente busca eficiencia energética, hay un cuarto camino, con dos opciones: hacer el upgrade de la línea existente a una línea mixta, o cambiar totalmente la tecnología, reemplazando toda la línea por una línea húmeda. En ese caso, aplique también la ficha R3."],["b","<b>Pedir:<\/b> fotos de la caldera, de los digestores o secadores, del condensador y del tanque de condensado; las tres últimas facturas de combustible."],["b","<b>Observar en la visita:<\/b> vapor saliendo a la atmósfera, trampas de vapor con fugas, agua caliente calentada con vapor directo."]],[["p","If the plant does not yet recover energy, there are three simple routes. The answers above tell which one applies."],["t",["Route","What it does","Depends on"],[["Water heating with cooking vapours","Uses the heat of the cooking vapours to produce hot water","The client using hot water: quantity, temperature range, average and peak consumption, steam cost"],["SRF, flash steam recovery","Generates low-pressure steam, up to 1.5 bar","The client having a use for low-pressure steam"],["SRC, direct condensate return","Returns condensate straight to the boiler and avoids flash steam generation","The line having continuous cookers, Rotatubos dryers or disc dryers"]]],["p","When the current process is dry rendering and the client is looking for energy efficiency, there is a fourth route, with two options: upgrade the existing line to a mixed line, or change the technology completely, replacing the whole line with a wet rendering line. In that case, also apply form R3."],["b","<b>Ask for:<\/b> photos of the boiler, the cookers or dryers, the condenser and the condensate tank; the last three fuel invoices."],["b","<b>Look for on site:<\/b> steam venting to atmosphere, leaking steam traps, hot water being heated with direct steam."]]]},{"code":"R5","title":["Rendimento e valoração de produtos","Rendimiento y valorización de productos","Yield and product value"],"intro":["Para cliente insatisfeito com o valor ou a qualidade da farinha e do óleo.","Para un cliente insatisfecho con el valor o la calidad de la harina y del aceite.","For a client unhappy with the value or quality of the meal and the fat."],"rows":[[["Entrada de matéria-prima por linha","“Quanto entra por dia de vísceras, penas, sangue, ossos?”","Balança"],["Entrada de materia prima por línea","“¿Cuánto entra por día de vísceras, plumas, sangre, huesos?”","Báscula"],["Raw material intake per line","“How much comes in per day of viscera, feathers, blood, bones?”","Scale"]],[["Produção de farinha e óleo","“Quanto sai por dia de cada produto?”","Expedição"],["Producción de harina y aceite","“¿Cuánto sale por día de cada producto?”","Despacho"],["Meal and fat production","“How much of each product goes out per day?”","Dispatch"]],[["Preço de venda de cada produto","“Por quanto vende a tonelada? Para quem?”","Notas fiscais"],["Precio de venta de cada producto","“¿A cuánto vende la tonelada? ¿A quién?”","Facturas"],["Selling price of each product","“What do you sell a tonne for? To whom?”","Invoices"]],[["Qualidade atual","“Qual a proteína, a gordura e a cinza da farinha? E a acidez do óleo?”","Laudos de laboratório"],["Calidad actual","“¿Cuál es la proteína, la grasa y la ceniza de la harina? ¿Y la acidez del aceite?”","Informes de laboratorio"],["Current quality","“What are the protein, fat and ash of the meal? And the acidity of the fat?”","Lab reports"]],[["Reclamações ou descontos do comprador","“O comprador desconta por quê?”","Comercial do cliente"],["Reclamos o descuentos del comprador","“¿Por qué le descuenta el comprador?”","Área comercial del cliente"],["Buyer complaints or discounts","“Why does the buyer apply discounts?”","Client’s sales team"]],[["Segregação das correntes","“Tudo vai misturado ou alguma corrente é processada separada?”","Visita"],["Segregación de las corrientes","“¿Todo va mezclado o alguna corriente se procesa por separado?”","Visita"],["Segregation of streams","“Does everything go mixed, or is any stream processed separately?”","Site visit"]],[["Tempo entre a geração e o processamento","“Quanto tempo a matéria-prima espera antes de entrar na linha?”","Supervisor"],["Tiempo entre la generación y el procesamiento","“¿Cuánto tiempo espera la materia prima antes de entrar a la línea?”","Supervisor"],["Time between generation and processing","“How long does the raw material wait before entering the line?”","Supervisor"]]],"extras":[[["b","<b>Desejável:<\/b> destino do sangue, perdas para a ETE (gordura no flotador, lodo), produto reprocessado ou fora de especificação."],["b","<b>Pedir:<\/b> laudos dos últimos seis meses, especificação exigida pelo comprador."],["b","<b>Observar na visita:<\/b> matéria-prima escorrendo líquido nas moegas, gordura visível no efluente, farinha escura ou com cheiro de queimado."],["b","<b>Oportunidades típicas:<\/b> farinha de baixa cinza para pet food, hidrolisados, recuperação de gordura e proteína do efluente."]],[["b","<b>Deseable:<\/b> destino de la sangre, pérdidas hacia la PTAR (grasa en el flotador, lodo), producto reprocesado o fuera de especificación."],["b","<b>Pedir:<\/b> informes de laboratorio de los últimos seis meses, especificación exigida por el comprador."],["b","<b>Observar en la visita:<\/b> materia prima escurriendo líquido en las tolvas, grasa visible en el efluente, harina oscura o con olor a quemado."],["b","<b>Oportunidades típicas:<\/b> harina de baja ceniza para pet food, hidrolizados, recuperación de grasa y proteína del efluente."]],[["b","<b>Nice to have:<\/b> destination of the blood, losses to the WWTP (fat in the DAF, sludge), reprocessed or off-spec product."],["b","<b>Ask for:<\/b> lab reports from the last six months, the buyer’s required specification."],["b","<b>Look for on site:<\/b> raw material draining liquid in the hoppers, visible fat in the effluent, dark meal or meal with a burnt smell."],["b","<b>Typical opportunities:<\/b> low-ash meal for pet food, hydrolysates, recovery of fat and protein from the effluent."]]]},{"code":"A1","title":["ETE nova, ampliação ou adequação","PTAR nueva, ampliación o adecuación","New WWTP, expansion or compliance upgrade"],"intro":["Vale para qualquer indústria, não só frigoríficos.","Vale para cualquier industria, no solo frigoríficos.","Applies to any industry, not only slaughterhouses."],"rows":[[["Tipo de indústria e produção diária","“O que a planta produz e quanto por dia?”","Cliente"],["Tipo de industria y producción diaria","“¿Qué produce la planta y cuánto por día?”","Cliente"],["Type of industry and daily production","“What does the plant produce and how much per day?”","Client"]],[["Volume de efluente por dia","“Quanta água a planta consome ou quanto efluente gera?”","Hidrômetro, conta de água, medidor da ETE"],["Volumen de efluente por día","“¿Cuánta agua consume la planta o cuánto efluente genera?”","Medidor de agua, factura de agua, medidor de la PTAR"],["Effluent volume per day","“How much water does the plant use, or how much effluent does it generate?”","Water meter, water bill, WWTP flow meter"]],[["Horas de produção e de lavagem","“Quando produz e quando lava a fábrica?”","Supervisor"],["Horas de producción y de lavado","“¿Cuándo produce y cuándo lava la planta?”","Supervisor"],["Production and wash-down hours","“When do you produce and when do you wash the plant?”","Supervisor"]],[["O que existe hoje","“Tem peneira, flotador, lagoas, tratamento biológico?”","Visita, fotos"],["Qué existe hoy","“¿Tiene tamiz, flotador, lagunas, tratamiento biológico?”","Visita, fotos"],["What exists today","“Is there a screen, a DAF, lagoons, biological treatment?”","Site visit, photos"]],[["Destino do efluente tratado","“Vai para rio, rede pública, solo ou reúso?”","Licença ambiental"],["Destino del efluente tratado","“¿Va a un río, a la red pública, al suelo o a reúso?”","Licencia ambiental"],["Destination of treated effluent","“Does it go to a river, the public sewer, land or reuse?”","Environmental licence"]],[["Exigência a cumprir","“O que o órgão ambiental cobra? Há prazo?”","Licença, auto de infração, termo de ajuste"],["Exigencia a cumplir","“¿Qué exige la autoridad ambiental? ¿Hay plazo?”","Licencia, acta de infracción, plan de cumplimiento"],["Requirement to be met","“What does the environmental authority require? Is there a deadline?”","Licence, notice of violation, compliance agreement"]],[["Análises do efluente","“Tem laudo recente do efluente bruto e do tratado?”","Laboratório"],["Análisis del efluente","“¿Tiene un análisis reciente del efluente crudo y del tratado?”","Laboratorio"],["Effluent analyses","“Do you have a recent analysis of raw and treated effluent?”","Laboratory"]],[["Área disponível","“Quanto espaço há para a estação?”","Layout"],["Área disponible","“¿Cuánto espacio hay para la planta de tratamiento?”","Layout"],["Available area","“How much space is there for the treatment plant?”","Layout"]]],"extras":[[["b","<b>Desejável:<\/b> produtos químicos usados, consumo e custo; custo de energia; vazão de pico; separação entre linhas (em bovinos, linha vermelha e linha verde)."],["b","<b>Pedir:<\/b> licença ambiental com condicionantes, laud isting dewatering equipment","“Is there a centrifuge, a press or drying beds?”","Site visit"]],[["Fonte de calor disponível","“Tem vapor, biogás ou outro calor sobrando?”","Cliente"],["Fuente de calor disponible","“¿Tiene vapor, biogás u otro calor sobrante?”","Cliente"],["Heat source available","“Is there spare steam, biogas or other heat?”","Client"]]],"extras":[[["b","<b>Desejável:<\/b> umidade do lodo, teor de gordura e proteína (em frigoríficos), interesse em usar o material seco como combustível ou fertilizante."],["b","<b>Pedir:<\/b> fotos do lodo e do ponto de carga, laudo de classificação do resíduo."],["b","<b>Oportunidades típicas:<\/b> skid de secagem para pequenas indústrias e municípios, retorno de gordura e proteína ao rendering, compostagem ou biodigestão."]],[["b","<b>Deseable:<\/b> humedad del lodo, contenido de grasa y proteína (en frigoríficos), interés en usar el material seco como combustible o fertilizante."],["b","<b>Pedir:<\/b> fotos del lodo y del punto de carga, informe de clasificación del residuo."],["b","<b>Oportunidades típicas:<\/b> skid de secado para pequeñas industrias y municipios, retorno de grasa y proteína al rendering, compostaje o biodigestión."]],[["b","<b>Nice to have:<\/b> sludge moisture, fat and protein content (in slaughterhouses), interest in using the dried material as fuel or fertiliser."],["b","<b>Ask for:<\/b> photos of the sludge and of the loading point, waste classification report."],["b","<b>Typical opportunities:<\/b> drying skid for small industries and municipalities, return of fat and protein to rendering, composting or anaerobic digestion."]]]},{"code":"A4","title":["Saneamento","Saneamiento","Sanitation"],"intro":["Para prefeitura, concessionária ou loteamento: água de abastecimento e esgoto.","Para un municipio, una empresa de servicios o una urbanización: agua de abastecimiento y aguas residuales.","For a municipality, utility or housing development: drinking water supply and sewage."],"rows":[[["Tipo de sistema","“É água para abastecimento ou tratamento de esgoto?”","Cliente"],["Tipo de sistema","“¿Es agua para abastecimiento o tratamiento de aguas residuales?”","Cliente"],["Type of system","“Is it drinking water supply or sewage treatment?”","Client"]],[["População atendida ou vazão","“Quantas pessoas ou quantos litros por segundo?”","Projeto, edital"],["Población atendida o caudal","“¿Cuántas personas o cuántos litros por segundo?”","Proyecto, pliego"],["Population served or flow","“How many people, or how many litres per second?”","Design, tender documents"]],[["Fonte de água ou corpo receptor","“De onde capta ou onde lança?”","Outorga, licença"],["Fuente de agua o cuerpo receptor","“¿De dónde capta o dónde descarga?”","Concesión, licencia"],["Water source or receiving body","“Where do you abstract from, or where do you discharge?”","Abstraction permit, licence"]],[["O que existe hoje","“Há estação em operação? Qual o problema?”","Visita"],["Qué existe hoy","“¿Hay una planta en operación? ¿Cuál es el problema?”","Visita"],["What exists today","“Is there a plant in operation? What is the problem?”","Site visit"]],[["Forma de contratação","“É licitação, concessão ou compra direta? Há edital?”","Cliente"],["Forma de contratación","“¿Es licitación, concesión o compra directa? ¿Hay pliego?”","Cliente"],["Form of contracting","“Is it a public tender, a concession or a direct purchase? Are there tender documents?”","Client"]],[["Prazo","“Quando precisa operar?”","Cliente"],["Plazo","“¿Cuándo necesita operar?”","Cliente"],["Deadline","“When does it need to be running?”","Client"]]],"extras":[[["b","<b>Pedir:<\/b> edital ou termo de referência, projeto básico se existir."]],[["b","<b>Pedir:<\/b> pliego o términos de referencia, proyecto básico si existe."]],[["b","<b>Ask for:<\/b> tender documents or terms of reference, basic design if available."]]]}],"bc":[[["Qual é a empresa, a unidade, a cidade e o país?","Identifica o cliente e as regras locais"],["¿Cuál es la empresa, la unidad, la ciudad y el país?","Identifica al cliente y las reglas locales"],["What is the company, the site, the city and the country?","Identifies the client and the local rules"]],[["O que a planta produz ou abate (aves, suínos, bovinos, outras carnes vermelhas, peixe, outro)?","Define a tecnologia"],["¿Qué produce o faena la planta (aves, cerdos, bovinos, otras carnes rojas, pescado, otro)?","Define la tecnología"],["What does the plant produce or slaughter (poultry, pigs, cattle, other red meat, fish, other)?","Defines the technology"]],[["Quanto por dia hoje, e quanto pretende chegar?","Define o porte"],["¿Cuánto por día hoy, y a cuánto pretende llegar?","Define el tamaño"],["How much per day today, and how much do they intend to reach?","Defines the size"]],[["Quantos dias por semana e horas por dia opera?","Define a capacidade horária"],["¿Cuántos días por semana y horas por día opera?","Define la capacidad horaria"],["How many days per week and hours per day does it operate?","Defines the hourly capacity"]],[["A planta existe ou é projeto novo? Em que estágio está?","Separa planta nova de planta em operação"],["¿La planta existe o es un proyecto nuevo? ¿En qué etapa está?","Separa planta nueva de planta en operación"],["Does the plant exist or is it a new project? What stage is it at?","Separates a new plant from an operating plant"]],[["O que faz hoje com os subprodutos e resíduos: processa, vende cru, paga para destinar?","Mostra o ganho possível"],["¿Qué hace hoy con los subproductos y residuos: los procesa, los vende crudos, paga para disponerlos?","Muestra la ganancia posible"],["What do they do today with by-products and waste: process them, sell them raw, pay for disposal?","Shows the possible gain"]],[["O que faz hoje com o efluente e o lodo?","Abre a frente ambiental"],["¿Qué hace hoy con el efluente y el lodo?","Abre el frente ambiental"],["What do they do today with effluent and sludge?","Opens the environmental front"]],[["Qual é o maior incômodo: custo, capacidade, qualidade, cheiro, fiscalização, falta de água?","Aponta a ficha do cenário"],["¿Cuál es la mayor molestia: costo, capacidad, calidad, olor, fiscalización, falta de agua?","Señala la ficha del escenario"],["What is the biggest pain: cost, capacity, quality, odour, inspections, lack of water?","Points to the scenario form"]],[["Tem caldeira? Qual combustível usa?","Define utilidades e custo de operação"],["¿Tiene caldera? ¿Qué combustible usa?","Define servicios y costo de operación"],["Is there a boiler? What fuel does it use?","Defines utilities and operating cost"]],[["Para quando precisa da solução funcionando?","Prioriza o atendimento"],["¿Para cuándo necesita la solución funcionando?","Prioriza la atención"],["By when do they need the solution running?","Sets the priority"]],[["Quem decide o investimento? Já existe orçamento ou financiamento previsto?","Qualifica a oportunidade"],["¿Quién decide la inversión? ¿Ya existe presupuesto o financiamiento previsto?","Califica la oportunidad"],["Who decides on the investment? Is there already a budget or financing planned?","Qualifies the opportunity"]],[["Já tem proposta de outro fornecedor ou consultoria no projeto?","Situa a concorrência"],["¿Ya tiene propuesta de otro proveedor o una consultora en el proyecto?","Ubica a la competencia"],["Is there already a proposal from another supplier, or a consultant on the project?","Locates the competition"]]],"seg":[[["Abate de aves","Vende frango inteiro ou em cortes? Qual o percentual de desossa? Aproveita miúdos e patas? Produz CMS do dorso? Penas e vísceras são transportadas com água ou a seco?"],["Faena de aves","¿Vende pollo entero o en cortes? ¿Cuál es el porcentaje de deshuese? ¿Aprovecha menudencias y patas? ¿Produce CDM (carne deshuesada mecánicamente) del espinazo? ¿Plumas y vísceras se transportan con agua o en seco?"],["Poultry slaughter","Do you sell whole birds or cut-up? What is the deboning percentage? Do you recover giblets and feet? Do you produce MDM (mechanically deboned meat) from the backs? Are feathers and viscera conveyed with water or dry?"]],[["Abate de suínos","A planta só abate ou também desossa? Vende pele e toucinho ou eles vão para o rendering? Quais miúdos são aproveitados e quais são descartados? Há escaldagem e depilação? O sangue é coletado separado?"],["Faena de cerdos","¿La planta solo faena o también deshuesa? ¿Vende piel y tocino o van al rendering? ¿Qué menudencias se aprovechan y cuáles se descartan? ¿Hay escaldado y depilado? ¿La sangre se recolecta por separado?"],["Pig slaughter","Does the plant only slaughter or also debone? Do you sell skin and backfat, or do they go to rendering? Which edible offal is recovered and which is discarded? Is there scalding and dehairing? Is blood collected separately?"]],[["Abate de bovinos","A planta só abate ou também desossa, e em que nível? Qual a raça e o peso médio dos animais? Quais miúdos são aproveitados e quais são descartados? Linha vermelha e linha verde são separadas? Para onde vai o conteúdo ruminal?"],["Faena de bovinos","¿La planta solo faena o también deshuesa, y a qué nivel? ¿Cuál es la raza y el peso promedio de los animales? ¿Qué menudencias se aprovechan y cuáles se descartan? ¿Línea roja y línea verde están separadas? ¿A dónde va el contenido ruminal?"],["Cattle slaughter","Does the plant only slaughter or also debone, and to what extent? What are the breed and average weight of the animals? Which edible offal is recovered and which is discarded? Are the red line and green line separate? Where does the rumen content go?"]],[["Outras carnes vermelhas (ovinos, caprinos, camelos e outras)","Qual a espécie, o peso médio e o abate diário? Qual a quantidade de resíduos por animal abatido?"],["Otras carnes rojas (ovinos, caprinos, camellos y otras)","¿Cuál es la especie, el peso promedio y la faena diaria? ¿Cuál es la cantidad de residuos por animal faenado?"],["Other red meat (sheep, goats, camels and others)","What are the species, average weight and daily slaughter? What is the quantity of waste per animal slaughtered?"]],[["Pescado","A produção é sazonal? A água é salgada?"],["Pescado","¿La producción es estacional? ¿El agua es salada?"],["Fish","Is production seasonal? Is the water salty?"]],[["Laticínios","Processa soro? Para onde ele vai hoje?"],["Lácteos","¿Procesa suero? ¿A dónde va hoy?"],["Dairy","Do you process whey? Where does it go today?"]],[["Outras indústrias de alimentos","Qual o produto principal e quais os produtos de limpeza usados?"],["Otras industrias de alimentos","¿Cuál es el producto principal y qué productos de limpieza se usan?"],["Other food industries","What is the main product and which cleaning chemicals are used?"]],[["Rendering independente (coletor)","Quanto do efluente vem dos condensados dos digestores?"],["Rendering independiente (recolector)","¿Cuánto del efluente viene de los condensados de los digestores?"],["Independent renderer (collector)","How much of the effluent comes from the cooker condensates?"]]],"eng":{"C1":{"title":["Identificação e escopo","Identificación y alcance","Identification and scope"],"ctx":["Define quem é o cliente, em que estágio está e o que espera receber. Item sem definição vira ponto de recomendação da Dheytécnica.","Define quién es el cliente, en qué etapa está y qué espera recibir. Un punto sin definir pasa a ser una recomendación de Dheytécnica.","Defines who the client is, what stage they are at and what they expect to receive. Any undefined item becomes a point for Dheytécnica to recommend."],"rows":[{"l":["Empresa, unidade, município e país","Empresa, unidad, municipio y país","Company, site, city and country"],"u":["texto","texto","text"],"t":"Rep"},{"l":["Tipo de planta e espécie","Tipo de planta y especie","Type of plant and species"],"u":["aves / suínos / bovinos / outras carnes vermelhas / peixe / outra indústria","aves / cerdos / bovinos / otras carnes rojas / pescado / otra industria","poultry / d discharge limits"],"u":["citar a norma, anexar","citar la norma, adjuntar","cite the regulation, attach"],"t":"Cli"},{"l":["Corpo receptor, classe e vazão de referência","Cuerpo receptor, clase y caudal de referencia","Receiving body, class and reference flow"],"u":["descrever","describir","describe"],"t":"Cli"},{"l":["Condicionantes da licença ligadas à ETE","Condicionantes de la licencia relacionadas con la PTAR","Licence conditions related to the WWTP"],"u":["descrever","describir","describe"],"t":"Cli"},{"l":["Outorga de captação e exigência de reúso","Concesión de captación y exigencia de reúso","Abstraction permit and reuse requirement"],"u":["S/N + descrever","S/N + describir","Y/N + describe"],"t":"Cli"},{"l":["Regras locais para destino de lodo: aterro, uso agrícola","Reglas locales para el destino del lodo: relleno sanitario, uso agrícola","Local rules for sludge disposal: landfill, agricultural use"],"u":["descrever","describir","describe"],"t":"Cli"}],"extras":[[],[],[]]},"MA7":{"title":["Água: fonte, qualidade e reúso","Agua: fuente, calidad y reúso","Water: source, quality and reuse"],"ctx":["O uso final da água define a tecnologia. Em indústria de alimentos, o que pode ser feito com água de reúso depende da autoridade sanitária de cada país.","El uso final del agua define la tecnología. En la industria de alimentos, lo que puede hacerse con agua de reúso depende de la autoridad sanitaria de cada país.","The final use of the water defines the technology. In the food industry, what can be done with reclaimed water depends on each country’s food safety authority."],"rows":[{"l":["Motivo do projeto","Motivo del proyecto","Reason for the project"],"u":["escassez / custo / limite de captação / exigência","escasez / costo / límite de captación / exigencia","scarcity / cost / abstraction limit / requirement"],"t":"Rep"},{"l":["Onde a água tratada seria usada","Dónde se usaría el agua tratada","Where the treated water would be used"],"u":["pátio / torre / caldeira / processo / consumo humano","patios / torre / caldera / proceso / consumo humano","yard / cooling tower / boiler / process / drinking water"],"t":"Rep"},{"l":["Volume desejado de água tratada","Volumen deseado de agua tratada","Desired volume of treated water"],"u":["m³/dia","m³/día","m³/day"],"t":"Rep"},{"l":["Tratamento de água existente","Tratamiento de agua existente","Existing water treatment"],"u":["descrever","describir","describe"],"t":"Rep"},{"l":["Padrão de qualidade exigido no ponto de uso e restrições da autoridade sanitária","Estándar de calidad exigido en el punto de uso y restricciones de la autoridad sanitaria","Quality standard required at the point of use and restrictions from the food safety authority"],"u":["descrever","describir","describe"],"t":"Cli"},{"l":["Análise da água de origem: turbidez, cor, dureza, ferro, manganês, sólidos dissolvidos, cloretos, coliformes","Análisis del agua de origen: turbidez, color, dureza, hierro, manganeso, sólidos disueltos, cloruros, coliformes","Source water analysis: turbidity, colour, hardness, iron, manganese, dissolved solids, chlorides, coliforms"],"u":["anexar laudo","adjuntar informe","attach report"],"t":"Cli"},{"l":["Saneamento: população atendida, vazão e forma de contratação","Saneamiento: población atendida, caudal y forma de contratación","Sanitation: population served, flow and form of contracting"],"u":["hab, L/s, descrever","hab, L/s, describir","inhabitants, L/s, describe"],"t":"Cli"}],"extras":[[],[],[]]},"X1":{"title":["Anexo de método: pesagem das correntes de matéria-prima","Anexo de método: pesaje de las corrientes de materia prima","Method annex: weighing the raw material streams"],"ctx":["Uma pesagem bem conduzida substitui a estimativa. O dado que escala é o quilo de matéria-prima por cabeça abatida.","Un pesaje bien hecho sustituye a la estimación. El dato que escala es el kilo de materia prima por cabeza faenada.","A well-run weighing replaces the estimate. The figure that scales is the kilogram of raw material per head slaughtered."],"rows":[],"extras":[[["num",["Pesar cada corrente separada, em balança aferida, em pelo menos 3 dias de abate não consecutivos.","Registrar o número de cabeças abatidas e desossadas em cada dia.","Pesar no ponto de entrega ao rendering, após drenagem e sem água livre; para o sangue, registrar o volume.","Não misturar correntes no recipiente. Se a operação já mistura, registrar a mistura e a composição estimada.","Registrar os horários de geração ao longo do turno, que dimensionam moegas e silos.","Para laboratório, coletar amostra composta de cerca de 2 kg por corrente, em embalagem hermética identificada; resfriar a 4 °C e congelar a −18 °C se o envio passar de 48 horas."]],["p","Registro de campo"],["grid",["Data","Cabeças abatidas","Corrente","Massa (kg)","Método de pesagem","Responsável"],[0.13,0.15,0.25,0.13,0.18,0.16],12,null]],[["num",["Pesar cada corriente por separado, en báscula calibrada, en al menos 3 días de faena no consecutivos.","Registrar el número de cabezas faenadas y deshuesadas en cada día.","Pesar en el punto de entrega al rendering, después del drenaje y sin agua libre; para la sangre, registrar el volumen.","No mezclar corrientes en el recipiente. Si la operación ya mezcla, registrar la mezcla y la composición estimada.","Registrar los horarios de generación a lo largo del turno, que dimensionan tolvas y silos.","Para laboratorio, tomar una muestra compuesta de unos 2 kg por corriente, en envase hermético identificado; enfriar a 4 °C y congelar a −18 °C si el envío supera las 48 horas."]],["p","Registro de campo"],["grid",["Fecha","Cabezas faenadas","Corriente","Masa (kg)","Método de pesaje","Responsable"],[0.13,0.15,0.25,0.13,0.18,0.16],12,null]],[["num",["Weigh each stream separately, on a calibrated scale, on at least 3 non-consecutive slaughter days.","Record the number of head slaughtered and deboned on each day.","Weigh at the point of delivery to rendering, after draining and with no free water; for blood, record the volume.","Do not mix streams in the container. If the operation already mixes them, record the mix and the estimated composition.","Record generation times through the shift, which size the hoppers and silos.","For the laboratory, take a composite sample of about 2 kg per stream, in an identified airtight container; cool to 4 °C and freeze at −18 °C if shipping takes more than 48 hours."]],["p","Field record"],["grid",["Date","Head slaughtered","Stream","Mass (kg)","Weighing method","Responsible"],[0.13,0.15,0.25,0.13,0.18,0.16],12,null]]]},"X2":{"title":["Anexo de método: amostragem de efluente","Anexo de método: muestreo de efluente","Method annex: effluent sampling"],"ctx":["A amostra composta e proporcional à vazão é o que torna o laudo representativo da planta.","La muestra compuesta y proporcional al caudal es lo que hace que el análisis sea representativo de la planta.","A flow-proportional composite sample is what makes the analysis representative of the plant."],"rows":[],"extras":[[["num",["Fazer duas campanhas separadas: regime de produção e regime de higienização.","Em cada ponto, coletar tomadas parciais a cada 30 minutos, cobrindo todo o período do regime.","Registrar a vazão no momento de cada tomada e compor a amostra de forma proporcional à vazão.","Identificar cada amostra: ponto, data, horário, vazão e condições do dia.","Garantir volume total suficiente para todas as análises previstas.","Manter a 4 °C até o laboratório, com conservante quando o parâmetro exigir, respeitando os prazos de preservação.","Usar os métodos do Standard Methods (SMEWW) e laboratório acreditado no país."]],["p","Registro de campo"],["grid",["Data","Hora","Ponto / corrente","Vazão ou massa","Temp. °C","Responsável / obs."],[0.13,0.1,0.27,0.16,0.11,0.23],10,null]],[["num",["Hacer dos campañas separadas: régimen de producción y régimen de limpieza.","En cada punto, tomar alícuotas cada 30 minutos, cubriendo todo el período del régimen.","Registrar el caudal en el momento de cada toma y componer la muestra de forma proporcional al caudal.","Identificar cada muestra: punto, fecha, hora, caudal y condiciones del día.","Garantizar un volumen total suficiente para todos los análisis previstos.","Mantener a 4 °C hasta el laboratorio, con preservante cuando el parámetro lo exija, respetando los plazos de preservación.","Usar los métodos del Standard Methods (SMEWW) y un laboratorio acreditado en el país."]],["p","Registro de campo"],["grid",["Fecha","Hora","Punto / corriente","Caudal o masa","Temp. °C","Responsable / obs."],[0.13,0.1,0.27,0.16,0.11,0.23],10,null]],[["num",["Run two separate campaigns: production regime and wash-down regime.","At each point, take sub-samples every 30 minutes, covering the whole period of the regime.","Record the flow at the time of each sub-sample and build the composite in proportion to flow.","Identify each sample: point, date, time, flow and conditions on the day.","Ensure enough total volume for all the analyses planned.","Keep at 4 °C until the laboratory, with preservative where the parameter requires it, respecting preservation times.","Use Standard Methods (SMEWW) and a laboratory accredited in the country."]],["p","Field record"],["grid",["Date","Time","Point / stream","Flow or mass","Temp. °C","Responsible / notes"],[0.13,0.1,0.27,0.16,0.11,0.23],10,null]]]},"X3":{"title":["Anexo de método: amostragem de resíduos sólidos","Anexo de método: muestreo de residuos sólidos","Method annex: solid waste sampling"],"ctx":["Em sólidos, o que se busca é representar a massa gerada ao longo do dia e entre lotes de origem diferente.","En sólidos, lo que se busca es representar la masa generada a lo largo del día y entre lotes de origen distinto.","For solids, the aim is to represent the mass generated through the day and across lots of different origin."],"rows":[],"extras":[[["num",["Coletar pelo menos 6 incrementos por dia, distribuídos entre início, meio e fim do turno.","Repetir em pelo menos 3 dias não consecutivos, cobrindo lotes de origens diferentes.","Homogeneizar e reduzir por quarteamento até a massa pedida pelo laboratório, em geral 2 kg.","Pesar em balança a massa total gerada no dia da coleta, para converter o laudo em carga diária.","Acondicionar em embalagem hermética; resfriar a 4 °C e congelar a −18 °C se o envio passar de 48 horas.","Fotografar cada amostra com a identificação visível e registrar data, ponto, massa e responsável."]],["p","Registro de campo"],["grid",["Data","Hora","Ponto / corrente","Vazão ou massa","Temp. °C","Responsável / obs."],[0.13,0.1,0.27,0.16,0.11,0.23],10,null]],[["num",["Tomar al menos 6 incrementos por día, distribuidos entre el inicio, la mitad y el final del turno.","Repetir en al menos 3 días no consecutivos, cubriendo lotes de orígenes diferentes.","Homogeneizar y reducir por cuarteo hasta la masa pedida por el laboratorio, en general 2 kg.","Pesar en báscula la masa total generada el día de la toma, para convertir el análisis en carga diaria.","Envasar herméticamente; enfriar a 4 °C y congelar a −18 °C si el envío supera las 48 horas.","Fotografiar cada muestra con la identificación visible y registrar fecha, punto, masa y responsable."]],["p","Registro de campo"],["grid",["Fecha","Hora","Punto / corriente","Caudal o masa","Temp. °C","Responsable / obs."],[0.13,0.1,0.27,0.16,0.11,0.23],10,null]],[["num",["Take at least 6 increments per day, spread across the start, middle and end of the shift.","Repeat on at least 3 non-consecutive days, covering lots of different origins.","Homogenise and reduce by quartering to the mass requested by the laboratory, usually 2 kg.","Weigh on a scale the total mass generated on the sampling day, to convert the analysis into a daily load.","Pack in an airtight container; cool to 4 °C and freeze at −18 °C if shipping takes more than 48 hours.","Photograph each sample with its identification visible and record date, point, mass and person responsible const $=(s,r=document)=>r.querySelector(s);
const t=k=>T[k][S.li];const L=a=>a[S.li];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(tag,attrs,html){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e;}
const seg=()=>SEGS.find(s=>s.k===S.seg);
const rendOK=()=>!seg()||seg().kind!=='ind';
function scenCodes(){return D.fichas.map(f=>f.code).filter(c=>S.scen[c]&&(rendOK()||c[0]==='A'));}
function steps(){const st=[{id:'inicio',n:t('s_inicio')},{id:'planta',n:t('s_planta')},{id:'nec',n:t('s_nec')},{id:'comum',n:t('s_comum')}];
  scenCodes().forEach(c=>st.push({id:'f'+c,n:c,code:c}));
  if(scenCodes().length)st.push({id:'det',n:t('s_det')});
  st.push({id:'res',n:t('s_res')});return st;}
function field(key,labelHtml,opts){opts=opts||{};const id='i'+key.replace(/[^a-zA-Z0-9]/g,'_');const w=el('div',{class:'f'});
  w.appendChild(el('label',{for:id},labelHtml));
  const inp=el(opts.short?'input':'textarea',{id:id});if(opts.short)inp.type='text';else inp.rows=opts.rows||2;
  inp.value=S.a[key]||'';inp.addEventListener('input',()=>{if(inp.value.trim())S.a[key]=inp.value;else delete S.a[key];save();});
  w.appendChild(inp);return w;}
function choice(items,cur,on,multi){const g=el('div',{class:'opts'});items.forEach(it=>{const pressed=multi?!!cur[it.k]:cur===it.k;
  const b=el('button',{class:'opt',type:'button','aria-pressed':pressed?'true':'false',onclick:()=>on(it.k)},'<span class="box"></span><span>'+(it.code?'<span class="code">'+esc(it.code)+'</span> ':'')+esc(it.n)+(it.d?'<small>'+esc(it.d)+'</small>':'')+'</span>');g.appendChild(b);});return g;}
function yesno(val,on){return choice([{k:'sim',n:t('sim')},{k:'nao',n:t('nao')}],val,on);}
function tableEl(head,rows){const w=el('div',{class:'tw'});let h='<table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';rows.forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>';});w.innerHTML=h+'</tbody></table>';return w;}
function extrasEl(list){const ul=el('ul',{class:'tips'});const box=el('div',{class:'card'});let has=false;
  list.forEach(e=>{if(e[0]==='b'||e[0]==='n'){ul.appendChild(el('li',null,e[1]));has=true;}else if(e[0]==='p'){if(has){box.appendChild(ul.cloneNode(true));ul.innerHTML='';has=false;}box.appendChild(el('p',null,e[1]));}else if(e[0]==='t'){box.appendChild(tableEl(e[1],e[2]));}});
  if(has)box.appendChild(ul);return box;}
/* ---------- screens ---------- */
const R={};
R.inicio=m=>{m.appendChild(el('h1',null,esc(t('h_inicio'))));m.appendChild(el('p',{class:'lead'},esc(t('p_inicio'))));
  m.appendChild(choice([{k:'real',n:t('m_real'),d:t('m_real_d')},{k:'treino',n:t('m_tr'),d:t('m_tr_d')}],TR?'treino':'real',setMode));
  if(TR)m.appendChild(el('button',{class:'btn sm',type:'button',style:'align-self:flex-start',onclick:loadExample},esc(t('ex'))));
  const c=el('div',{class:'card'});[['rep','id_rep'],['reg','id_reg'],['ct','id_ct'],['cli','id_cli'],['dt','id_dt']].forEach(x=>c.appendChild(field('ID|'+x[0],esc(t(x[1])),{short:true})));m.appendChild(c);
  m.appendChild(el('div',{class:'ctx'},esc(t('rules'))));m.appendChild(el('p',{class:'note'},esc(t('draft'))));};
R.planta=m=>{m.appendChild(el('h1',null,esc(t('h_planta'))));
  m.appendChild(choice(SEGS.map(s=>({k:s.k,n:L(s.n)})),S.seg,k=>{S.seg=k;save();render();}));
  if(S.seg){m.appendChild(el('h2',null,esc(t('q_status'))));m.appendChild(choice([{k:'nova',n:t('nova')},{k:'oper',n:t('oper')}],S.status,k=>{S.status=k;save();render();}));
    if(seg().kind==='abate'&&S.status==='oper'){m.appendChild(el('h2',null,esc(t('q_rend'))));m.appendChild(yesno(S.rend,k=>{S.rend=k;save();render();}));}
    if(S.status==='oper'){m.appendChild(el('h2',null,esc(t('q_ete'))));m.appendChild(yesno(S.ete,k=>{S.ete=k;save();render();}));}}};
function pains(m,list,pre){list.forEach((r,i)=>{const row=r[S.li];const k=pre+i;m.appendChild(choice([{k:k,n:row[0],d:row[1],code:row[2]}],S.pains,()=>{S.pains[k]=!S.pains[k];if(S.pains[k])row[2].split('+').forEach(c=>{S.scen[c.trim()]=true;});save();render();},true));});}
R.nec=m=>{m.appendChild(el('h1',null,esc(t('h_nec'))));m.appendChild(el('p',{class:'lead'},esc(t('p_nec'))));
  if(rendOK()){m.appendChild(el('h2',null,esc(t('rendg'))));pains(m,D.mapR,'r');}
  m.appendChild(el('h2',null,esc(t('amb'))));pains(m,D.mapA,'a');
  m.appendChild(el('h2',null,esc(t('scen'))));m.appendChild(el('p',{class:'note'},esc(t('p_scen'))));
  m.appendChild(choice(D.fichas.filter(f=>rendOK()||f.code[0]==='A').map(f=>({k:f.code,n:L(f.title),code:f.code})),S.scen,k=>{S.scen[k]=!S.scen[k];save();render();},true));
  if(!scenCodes().length)m.appendChild(el('p',{class:'note'},esc(t('none'))));};
R.comum=m=>{m.appendChild(el('div',{class:'band'},'<b>BC</b><span>'+esc(t('s_comum'))+'</span>'));m.appendChild(el('p',{class:'lead'},esc(t('p_comum'))));
  const c=el('div',{class:'card'});D.bc.forEach((q,i)=>{const x=q[S.li];c.appendChild(field('BC|'+i,(i+1)+'. '+esc(x[0])+'<div class="hint">'+esc(x[1])+'</div>'));});m.appendChild(c);
  if(seg()){const s=D.seg[seg().sr][S.li];m.appendChild(el('h2',null,esc(t('keyq'))));const k=el('div',{class:'card'});k.appendChild(field('SEG|'+seg().k,esc(s[0])+'<div class="ask">'+esc(s[1])+'</div>',{rows:4}));m.appendChild(k);}};
function ficha(m,code){const f=D.fichas.find(x=>x.code===code);m.appendChild(el('div',{class:'band'},'<b>'+code+'</b><span>'+esc(L(f.title))+'</span>'));m.appendChild(el('p',{class:'lead'},esc(L(f.intro))));
  const c=el('div',{class:'card'});f.rows.forEach((r,i)=>{const x=r[S.li];c.appendChild(field('K|'+code+'|'+i,esc(x[0])+'<div class="ask">'+esc(x[1])+'</div>'+(x[2]?'<div class="hint">'+esc(t('where'))+' '+esc(x[2])+'</div>':'')));});
  c.appendChild(field('K|'+code+'|obs',esc(t('notes')),{rows:3}));m.appendChild(c);
  const d=el('details');d.appendChild(el('summary',null,esc(t('tips'))));const b=el('div',{class:'body'});b.appendChild(extrasEl(f.extras[S.li]));d.appendChild(b);m.appendChild(d);
  if((code==='R1'||code==='R5')&&seg()&&seg().fx.length){const d2=el('details');d2.appendChild(el('summary',null,esc(t('fx'))));const b2=el('div',{class:'body'});b2.appendChild(tableEl([t('ind'),t('rg')],seg().fx.map(i=>D.faixas[i][S.li])));d2.appendChild(b2);m.appendChild(d2);}}
function modList(){const req={},all={};scenCodes().forEach(c=>{D.struct[c][0].forEach(x=>{req[x]=1;all[x]=1;});D.struct[c][1].forEach(x=>{all[x]=1;});});
  const skip={};if(S.status==='nova')['MR3','MR5','MA3','MA4'].forEach(x=>skip[x]=1);if(S.ete==='nao')['MA3','MA4'].forEach(x=>skip[x]=1);
  if(seg()&&seg().kind==='abate'&&S.status==='oper'&&S.rend==='nao')['MR3','MR5'].forEach(x=>skip[x]=1);
  return ORDER.filter(x=>all[x]&&!skip[x]&&(rendOK()||x.slice(0,2)!=='MR')).map(x=>({code:x,opt:!req[x]}));}
function rowIdx(code){const mod=D.eng[code];let idx=mod.rows.map((_,i)=>i);if(code==='C3'&&seg())idx=seg().c3;return idx;}
function filt(code,ti,rows){const map={MR1:MR1T,MA1:MA1T,MA2:MA2T}[code];if(!map||!seg()||ti!==0)return rows;const keep=map[seg().k];return keep?rows.filter((_,i)=>keep.includes(i)):rows;}
function gridEl(code,gi,g){const heads=g[1],first=g[4];const gk=code+'|g'+gi;const n=first?first.length:(S.gr[gk]||3);const w=el('div',{class:'tw'});const tb=el('table',{class:'grid'});
  tb.appendChild(el('thead',null,'<tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'));const body=el('tbody');
  for(let r=0;r<n;r++){const tr=el('tr');heads.forEach((h,c)=>{if(c===0&&first){tr.appendChild(el('td',{class:'fx'},esc(first[r])));return;}
    const key='E|'+gk+'|'+r+'|'+c;const td=el('td');const inp=el('input',{type:'text','aria-label':h+' '+(r+1)});inp.value=S.a[key]||'';inp.addEventListener('input',()=>{if(inp.value.trim())S.a[key]=inp.value;else delete S.a[key];save();});td.appendChild(inp);tr.appendChild(td);});body.appendChild(tr);}
  tb.appendChild(body);w.appendChild(tb);const box=el('div',{class:'f'});box.appendChild(w);
  if(!first)box.appendChild(el('button',{class:'btn sm',type:'button',style:'align-self:flex-start',onclick:()=>{S.gr[gk]=n+2;save();render();}},esc(t('addrow'))));return box;}
function countMod(code){const p='E|'+code+'|';return Object.keys(S.a).filter(k=>k.startsWith(p)).length;}
let openMods={};
R.det=m=>{m.appendChild(el('h1',null,esc(t('h_det'))));m.appendChild(el('p',{class:'lead'},esc(t('p_det'))));
  m.appendChild(el('h2',null,esc(t('q_det'))));m.appendChild(yesno(S.deep,k=>{S.deep=k;save();render();}));
  if(S.deep!=='sim')return;m.appendChild(el('p',{class:'note'},esc(t('leg'))));
  modList().forEach(mm=>{const mod=D.eng[mm.code];const d=el('details');if(openMods[mm.code])d.open=true;d.addEventListener('toggle',()=>{openMods[mm.code]=d.open;});
    const cnt=countMod(mm.code);d.appendChild(el('summary',null,'<span class="code">'+mm.code+'</span><span>'+esc(L(mod.title))+(mm.opt?' · '+esc(t('optm')):'')+'</span><span class="cnt">'+(cnt?cnt+' '+esc(t('filled')):'')+'</span>'));
    const b=el('div',{class:'body'});b.appendChild(el('div',{class:'ctx'},esc(L(mod.ctx))));
    rowIdx(mm.code).forEach(i=>{const r=mod.rows[i];const f=field('E|'+mm.code+'|r'+i,'<span class="row2"><span>'+esc(L(r.l))+'</span><span class="badge '+r.t+'">'+r.t.toUpperCase()+'</span></span><div class="hint">'+esc(L(r.u))+'</div>',{short:true});b.appendChild(f);});
    let ti=0;mod.extras[S.li].forEach((e,gi)=>{if(e[0]==='table'){b.appendChild(tableEl(e[1],filt(mm.code,ti,e[2])));ti++;}else if(e[0]==='p'){b.appendChild(el('p',{class:'note'},esc(e[1])));}else if(e[0]==='num'){const ol=el('ol',{class:'tips'});e[1].forEach(x=>ol.appendChild(el('li',null,esc(x))));b.appendChild(ol);}else if(e[0]==='grid'){b.appendChild(gridEl(mm.code,gi,e));}});
    b.appendChild(field('E|'+mm.code+'|obs',esc(t('notes')),{rows:2}));d.appendChild(b);m.appendChild(d);});};
/* ---------- summary ---------- */
function summary(){const o=[];const ln=s=>o.push(s);const A=S.a;let n=0;const nd=[];
  const put=(lab,key)=>{if(A[key]){ln('- '+lab+': '+A[key].replace(/\s*\n\s*/g,' / '));n++;}else nd.push(lab);};
  if(TR){ln(t('sm_tr'));ln('');}
  ln(t('sm_title'));ln('='.repeat(34));
  [['rep','id_rep'],['reg','id_reg'],['ct','id_ct'],['cli','id_cli'],['dt','id_dt']].forEach(x=>{if(A['ID|'+x[0]])ln(t(x[1])+': '+A['ID|'+x[0]]);});
  if(seg())ln(t('sm_seg')+': '+L(seg().n));
  if(S.status)ln(t('q_status')+': '+t(S.status));
  if(S.rend&&seg()&&seg().kind==='abate'&&S.status==='oper')ln(t('q_rend')+' '+t(S.rend));
  if(S.ete&&S.status==='oper')ln(t('q_ete')+' '+t(S.ete));
  const said=[];D.mapR.forEach((r,i)=>{if(S.pains['r'+i]&&rendOK())said.push(r[S.li][0]);});D.mapA.forEach((r,i)=>{if(S.pains['a'+i])said.push(r[S.li][0]);});
  if(said.length){ln('');ln(t('sm_said')+':');said.forEach(x=>ln('- '+x));}
  const sc=scenCodes();if(sc.length){ln('');ln(t('sm_scen')+': '+sc.map(c=>c+' '+L(D.fichas.find(f=>f.code===c).title)).join('; '));}
  ln('');ln('## '+t('s_comum'));D.bc.forEach((q,i)=>put((i+1)+'. '+q[S.li][0],'BC|'+i));
  if(seg())put(D.seg[seg().sr][S.li][0],'SEG|'+seg().k);
  sc.forEach(c=>{const f=D.fichas.find(x=>x.code===c);ln('');ln('## '+c+' '+L(f.title));f.rows.forEach((r,i)=>put(r[S.li][0],'K|'+c+'|'+i));if(A['K|'+c+'|obs'])ln('- '+t('notes')+': '+A['K|'+c+'|obs'].replace(/\s*\n\s*/g,' / '));});
  if(S.deep==='sim'&&sc.length){modList().forEach(mm=>{if(!countMod(mm.code))return;const mod=D.eng[mm.code];ln('');ln('## '+mm.code+' '+L(mod.title));
    rowIdx(mm.code).forEach(i=>{const k='E|'+mm.code+'|r'+i;if(A[k]){ln('- ['+mod.rows[i].t.toUpperCase()+'] '+L(mod.rows[i].l)+': '+A[k]);n++;}});
    mod.extras[S.li].forEach((e,gi)=>{if(e[0]!=='grid')return;const gk='E|'+mm.code+'|g'+gi+'|';const rowsN={};Object.keys(A).filter(k=>k.startsWith(gk)).forEach(k=>{rowsN[k.slice(gk.length).split('|')[0]]=1;});
      Object.keys(rowsN).map(Number).sort((a,b)=>a-b).forEach(r=>{const parts=[];e[1].forEach((h,c)=>{if(c===0&&e[4]){parts.push(e[4][r]);return;}const v=A[gk+r+'|'+c];if(v)parts.push(h+'='+v);});ln('  · '+parts.join(' | '));n++;});});
    if(A['E|'+mm.code+'|obs'])ln('- '+t('notes')+': '+A['E|'+mm.code+'|obs'].replace(/\s*\n\s*/g,' / '));});}
  if(nd.length){ln('');ln('## '+t('sm_nd'));nd.forEach(x=>ln('- '+x));}
  ln('');ln(n+' '+t('sm_ans')+' · '+new Date().toISOString().slice(0,10));return o.join('\n');}
let dlNS=null,confirmNew=false;
R.res=m=>{m.appendChild(el('h1',null,esc(t('h_res'))));m.appendChild(el('p',{class:'lead'},esc(t('p_res'))));const txt=summary();
  const acts=el('div',{class:'acts'});const msg=el('div',{class:'msg',role:'status'});
  acts.appendChild(el('button',{class:'btn pri',type:'button',onclick:async()=>{try{await navigator.clipboard.writeText(txt);msg.textContent=t('copied');}catch(e){msg.textContent=t('copyfail');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);}}},esc(t('copy'))));
  const fileSave=(fn,data)=>{const u=URL.createObjectURL(new Blob([data],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return Promise.resolve();};
  if(dlNS||MODE!=='artifact'){const nm='coleta-dheytecnica-'+(S.a['ID|cli']||'cliente').replace(/[^a-zA-Z0-9]+/g,'-').slice(0,30)+'-'+new Date().toISOString().slice(0,10);
    const sv=async(fn,data)=>{try{if(dlNS)await dlNS.save({filename:fn,data:data});else await fileSave(fn,data);msg.textContent=t('saved');}catch(e){msg.textContent=t('savefail');}};
    acts.appendChild(el('button',{class:'btn',type:'button',onclick:()=>sv(nm+'.txt',txt)},esc(t('dl'))));
    acts.appendChild(el('button',{class:'btn',type:'button',onclick:()=>sv(nm+'.json',JSON.stringify({v:1,lang:LG[S.li],state:S},null,1))},esc(t('dlj'))));}
  if(MODE!=='artifact'){if(navigator.share)acts.appendChild(el('button',{class:'btn',type:'button',onclick:async()=>{try{await navigator.share({title:t('sm_title'),text:txt});}catch(e){}}},esc(t('share'))));
    acts.appendChild(el('button',{class:'btn',type:'button',onclick:()=>{try{window.print();}catch(e){}}},esc(t('print'))));}
  m.appendChild(acts);m.appendChild(msg);const pre=el('pre',{class:'sum',tabindex:'0'});pre.textContent=txt;m.appendChild(pre);
  const c=el('div',{class:'acts'});if(!confirmNew){c.appendChild(el('button',{class:'btn sm danger',type:'button',onclick:()=>{confirmNew=true;render();}},esc(t('newc'))));}
  else{c.appendChild(el('span',{class:'note'},esc(t('sure'))));c.appendChild(el('button',{class:'btn sm danger',type:'button',onclick:()=>{S=blank(S.li);confirmNew=false;save();render();}},esc(t('yesdel'))));c.appendChild(el('button',{class:'btn sm',type:'button',onclick:()=>{confirmNew=false;render();}},esc(t('cancel'))));}
  m.appendChild(c);};
/* ---------- shell ---------- */
function render(){const st=steps();if(S.step>=st.length)S.step=st.length-1;const cur=st[S.step];document.documentElement.lang=LG[S.li];
  document.body.classList.toggle('treino',TR);$('#slogan').textContent=TR?t('trban'):t('slogan');const lg=$('#langs');lg.innerHTML='';LG.forEach((l,i)=>lg.appendChild(el('button',{type:'button','aria-pressed':i===S.li?'true':'false',onclick:()=>{S.li=i;save();render();}},l.toUpperCase())));
  const rail=$('#rail');rail.innerHTML='';st.forEach((s,i)=>{const b=el('button',{type:'button',class:i===S.step?'cur':(i<S.step?'done':''),onclick:()=>{S.step=i;save();render();scrollTo(0,0);}},esc(s.n));rail.appendChild(b);});
  const cb=rail.querySelector('.cur');if(cb&&cb.scrollIntoView)try{cb.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}
  const m=$('#main');const y=window.scrollY;m.innerHTML='';if(cur.code)ficha(m,cur.code);else R[cur.id](m);if(render.keep)scrollTo(0,y);render.keep=true;
  const p=$('#prev'),n=$('#next');p.textContent=t('back');p.style.visibility=S.step?'visible':'hidden';n.textContent=S.step===st.length-2?t('finish'):t('next');n.style.visibility=S.step<st.length-1?'visible':'hidden';
  $('#pos').textContent=(S.step+1)+' / '+st.length;}
$('#prev').addEventListener('click',()=>{if(S.step>0){S.step--;save();render.keep=false;render();scrollTo(0,0);}});
$('#next').addEventListener('click',()=>{if(S.step<steps().length-1){S.step++;save();render.keep=false;render();scrollTo(0,0);}});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
(async()=>{try{if(window.claude&&window.claude.use){dlNS=await window.claude.use('downloads');if(dlNS&&steps()[S.step].id==='res')render();}}catch(e){}})();
</script>
